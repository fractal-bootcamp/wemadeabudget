name: Ping Database

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs weekly at midnight on Sunday
  workflow_dispatch:      # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X POST ${{ secrets.DATABASE_URL }} \
          -H "Content-Type: application/json" \
          -d '{"query": "SELECT 1"}' 